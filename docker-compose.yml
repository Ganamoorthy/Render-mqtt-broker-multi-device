services:
  mqtt-broker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: render-mqtt-broker
    ports:
      - "10000:10000"  # WebSocket (ws://)
      - "1883:1883"    # Standard Raw TCP MQTT (mqtt://)
    environment:
      - PORT=10000
      - MQTT_DEVICES=admin:admin123,esp32_device_01:device123,sensor_node_02:sensor123
    restart: unless-stopped
