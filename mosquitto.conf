# ==============================================================================
# Mosquitto Broker Configuration for Render (WebSocket + TCP)
# Multi-Device IoT Architecture
# ==============================================================================

# ------------------------------------------------------------------------------
# Primary Listener: WebSocket (Required for Render Web Services)
# Render routes external traffic to $PORT (default 10000) and terminates TLS (wss://).
listener 10000 0.0.0.0
protocol websockets
http_dir /mosquitto/http
max_connections -1

# Secondary Listener: Standard Raw TCP MQTT (Port 1883)
# Accessible when running locally via Docker, on a VPS, or via Render Private Networking.
# NOTE: Render's public edge router does NOT forward raw TCP ports; it forwards HTTP/WS.
# listener 1883 0.0.0.0
# protocol mqtt

# ------------------------------------------------------------------------------
# 2. Authentication & Authorization
# ------------------------------------------------------------------------------
# Enforce strict client authentication - anonymous connections are rejected
allow_anonymous false

# Path to the password file storing hashed credentials
password_file /mosquitto/config/pwfile

# Path to the Access Control List enforcing device topic isolation
acl_file /mosquitto/config/aclfile

# ------------------------------------------------------------------------------
# 3. Logging & Monitoring
# ------------------------------------------------------------------------------
# Stream logs directly to stdout so Render log viewer captures all events
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe

# Output connection and disconnection timestamps
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S

# ------------------------------------------------------------------------------
# 4. Persistence
# ------------------------------------------------------------------------------
# Render containers use ephemeral storage unless a persistent disk is attached.
# Retain in-memory for low latency; enable persistence if a Render Disk is mounted.
persistence false
# persistence_location /mosquitto/data/

# ------------------------------------------------------------------------------
# 5. Optional MQTTS (Port 8883) and In-Container TLS Configuration
# ------------------------------------------------------------------------------
# On Render: Render automatically terminates TLS for you at the edge on wss:// port 443!
# If you are hosting on a VPS or require raw TCP TLS (mqtts:// on port 8883),
# place your certificates in the ssl/ directory and uncomment below:
# listener 8883 0.0.0.0
# protocol mqtt
# cafile /mosquitto/ssl/ca.crt
# certfile /mosquitto/ssl/server.crt
# keyfile /mosquitto/ssl/server.key
